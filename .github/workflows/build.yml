name: Build

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Typecheck has its own workflow; build only. Upstash env is absent, so the memory store is used.
      - run: pnpm astro build
